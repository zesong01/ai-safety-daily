name: Collect and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
    # Beijing 09:17 through 18:17: recover missed triggers/failed deployments.
    - cron: '17 1-10 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: 'Collect official feeds before publishing'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
      - name: Check the publicly deployed issue
        id: check
        if: github.event_name == 'schedule'
        run: python3 scripts/check_freshness.py
  build:
    needs: freshness
    if: github.event_name != 'schedule' || needs.freshness.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Check collector rules
        run: python -m unittest discover -s tests
      - name: Collect current issue
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: python scripts/collect.py
      - name: Build static site
        run: npm run build
      - name: Save collected history
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/briefs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily feed collection'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
